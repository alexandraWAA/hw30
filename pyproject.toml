[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-project"
version = "0.1.0"
description = "LMS system with Django REST Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django==4.2.7",
    "djangorestframework==3.14.0",
    "django-filter==23.5",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "Pillow==10.1.0",
]

[project.optional-dependencies]
dev = [
    "black==23.12.1",
    "isort==5.13.2",
    "flake8==7.0.0",
    "pytest==7.4.4",
    "pytest-django==4.7.0",
    "ipython==8.20.0",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = ["migrations"]
known_first_party = ["config", "users", "lms"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = [
    "migrations",
    "venv",
    ".venv",
]